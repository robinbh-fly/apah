<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantheon walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d2126;
  --panel:rgba(233,227,215,.93);
  --ink:#2b2724;
  --muted:#675e55;
  --line:rgba(60,48,38,.22);
  --accent:#7B2D26;
  --accent-ink:#f4efe6;
  --gold:#B88E33;
  --hover:rgba(123,45,38,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:rgba(34,37,41,.92);
    --ink:#ece6da;
    --muted:#a99f92;
    --line:rgba(255,255,255,.15);
    --accent:#a3463b;
    --accent-ink:#f7f1e8;
    --gold:#D9B45A;
    --hover:rgba(217,180,90,.1);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:rgba(34,37,41,.92);
  --ink:#ece6da;
  --muted:#a99f92;
  --line:rgba(255,255,255,.15);
  --accent:#a3463b;
  --accent-ink:#f7f1e8;
  --gold:#D9B45A;
  --hover:rgba(217,180,90,.1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}
#scene.pointing{cursor:pointer}

.hud-top,.hud-bottom{position:fixed;left:0;right:0;z-index:5;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.hud-top{top:0;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 14px) 0 calc(env(safe-area-inset-left,0px) + 14px)}
.hud-bottom{bottom:0;align-items:flex-end;padding:0 calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px)}

.panel{pointer-events:auto;background:var(--panel);color:var(--ink);border-top:3px solid var(--gold);border-radius:3px;box-shadow:0 10px 34px rgba(12,10,8,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.title-card{padding:14px 16px 10px;width:17.5rem;max-width:100%}
.title-card h1{font-family:"Marcellus","Trajan Pro",Georgia,serif;font-weight:400;font-size:2rem;line-height:1;letter-spacing:.06em;margin:0}
.title-card .sub{margin:.35rem 0 .6rem;color:var(--muted);font-size:.98rem;line-height:1.3}
.toggle{font:inherit;font-weight:500;background:none;border:0;color:var(--ink);padding:.35rem 0;cursor:pointer;display:flex;align-items:center;gap:.4rem;width:100%;border-top:1px solid var(--line)}
.toggle::after{content:"";width:.45rem;height:.45rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:auto;transition:transform .2s}
.toggle[aria-expanded="true"]::after{transform:rotate(-135deg) translateY(-2px)}
#stops{list-style:none;margin:0;padding:.2rem 0 0}
#stops[hidden]{display:none}
#stops button{font:inherit;display:grid;grid-template-columns:1.6rem 1fr;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:.3rem .35rem;border-radius:3px;cursor:pointer;font-size:1rem}
#stops button:hover{background:var(--hover)}
#stops button .n{font-family:"Marcellus",Georgia,serif;color:var(--gold)}
#stops button[aria-current="step"]{background:var(--hover);font-weight:700}

.sun-card{padding:12px 16px 12px;width:16.5rem;max-width:100%}
.sun-card label{display:flex;justify-content:space-between;font-weight:500;font-size:1rem;gap:.5rem}
.sun-card output{font-family:"Marcellus",Georgia,serif;color:var(--gold)}
.sun-card input{width:100%;accent-color:var(--accent);margin:.5rem 0 .3rem}
.sun-card .hint{margin:0;color:var(--muted);font-size:.9rem;line-height:1.35}

.info{padding:14px 18px 14px;width:26rem;max-width:100%;position:relative;max-height:70vh;overflow-y:auto}
.info[hidden]{display:none}
.info .num{margin:0 0 .15rem;color:var(--muted);font-size:.92rem}
.info h2{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:1.55rem;line-height:1.15;margin:0 2rem .45rem 0;letter-spacing:.02em}
.info .text{margin:0 0 .8rem;font-size:1.05rem;line-height:1.5;max-height:32vh;overflow:auto}
.quiz{margin:0 0 .8rem;border-top:1px solid var(--line);padding-top:.55rem}
.quiz[hidden]{display:none}
.quiz summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:.5rem;padding:.15rem 0;border-radius:3px}
.quiz summary::-webkit-details-marker{display:none}
.quiz summary::before{content:"";width:.4rem;height:.4rem;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg);transition:transform .2s}
.quiz[open] summary::before{transform:rotate(45deg)}
.quiz summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.quiz .q{margin:.5rem 0 .5rem;font-size:1.02rem;line-height:1.4}
.quiz .opts{display:grid;gap:.35rem}
.quiz .opt{font:inherit;text-align:left;font-size:.98rem;line-height:1.3;padding:.42rem .65rem;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--ink);cursor:pointer}
.quiz .opt:hover:not(:disabled){background:var(--hover)}
.quiz .opt:disabled{cursor:default;color:var(--ink)}
.quiz .opt.right{border:2px solid var(--gold);background:var(--hover);font-weight:700}
.quiz .opt.wrong{border-color:var(--accent);text-decoration:line-through;opacity:.75}
.quiz .fb{margin:.55rem 0 0;font-size:.98rem;line-height:1.45}
.quiz .fb[hidden]{display:none}
.quiz .fb b{color:var(--accent)}
.quiz .retry{margin-top:.5rem;font-size:.92rem;padding:.3rem .7rem}
@media (prefers-reduced-motion:reduce){.quiz summary::before{transition:none}}
.actions{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{font:inherit;font-weight:500;font-size:1rem;padding:.45rem .9rem;border-radius:3px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.close{position:absolute;top:10px;right:10px;width:2rem;height:2rem;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:3px;font-size:1.4rem;line-height:1}
.close:hover{background:var(--hover);color:var(--ink)}
.reopen{pointer-events:auto}
.reopen[hidden]{display:none}

.pad{pointer-events:auto;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
.coarse .pad{display:grid}
.pad button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:50%;font-size:1.1rem;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 6px 18px rgba(12,10,8,.25)}
.pad button:active{background:var(--accent);color:var(--accent-ink)}
.pad .f{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .b{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}

.tip{position:fixed;z-index:9;pointer-events:none;background:var(--panel);color:var(--ink);padding:.3rem .6rem;border-radius:3px;font-size:.95rem;border-left:3px solid var(--gold);box-shadow:0 6px 18px rgba(12,10,8,.25);transform:translate(14px,14px);white-space:nowrap}
.tip[hidden]{display:none}

button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

@media (max-width:700px){
  .hud-top{flex-direction:column;gap:8px}
  .title-card,.sun-card{width:100%}
  .title-card{display:grid;grid-template-columns:auto 1fr;column-gap:.8rem;align-items:baseline;padding:10px 14px 6px}
  .title-card h1{font-size:1.45rem}
  .title-card .sub{margin:0;font-size:.88rem}
  .title-card .toggle,.title-card #stops{grid-column:1 / -1}
  .sun-card{padding:8px 14px}
  .sun-card .hint{display:none}
  .info{width:100%}
  .info h2{font-size:1.3rem}
  .info .text{font-size:1rem;max-height:26vh}
  .info-open.coarse .pad{display:none}
}
@media (prefers-reduced-motion:reduce){.toggle::after{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Walkable 3D model of the Pantheon in Rome"></canvas>

<div class="hud-top">
  <header class="panel title-card">
    <h1>Pantheon</h1>
    <p class="sub">Rome, rebuilt under Hadrian, c. 118–125 CE</p>
    <button class="toggle" id="stopsToggle" aria-expanded="true" aria-controls="stops">Tour stops</button>
    <ol id="stops"></ol>
  </header>
  <div class="panel sun-card">
    <label for="sun">Sunlight <output id="sunOut" for="sun">11:00 AM</output></label>
    <input type="range" id="sun" min="6.5" max="17.5" step="0.25" value="11">
    <p class="hint" id="hint">Drag to look around. Walk with W A S D or the arrow keys; hold Shift to go faster.</p>
  </div>
</div>

<div class="hud-bottom">
  <section class="panel info" id="info" aria-live="polite">
    <button class="close" id="close" aria-label="Hide stop info">×</button>
    <p class="num" id="infoNum"></p>
    <h2 id="infoTitle"></h2>
    <p class="text" id="infoText"></p>
    <details class="quiz" id="quiz" hidden></details>
    <div class="actions">
      <button class="btn" id="prev">Previous</button>
      <button class="btn primary" id="next">Next stop</button>
    </div>
  </section>
  <button class="btn panel reopen" id="reopen" hidden>Show stop info</button>
  <div class="pad" id="pad" aria-label="Walk controls">
    <button class="f" data-dir="f" aria-label="Walk forward">▲</button>
    <button class="l" data-dir="l" aria-label="Step left">◀</button>
    <button class="b" data-dir="b" aria-label="Walk back">▼</button>
    <button class="r" data-dir="r" aria-label="Step right">▶</button>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const V3 = THREE.Vector3;
const R = 21.6;          // interior radius (43.3 m diameter)
const H = 21.6;          // height of the drum; dome springs here
const OCULUS = 4.1;      // oculus radius
const OUTER = 27;        // outer drum radius (walls ~6 m thick)
const EYE = 1.7;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
if (coarse) document.body.classList.add('coarse');
document.getElementById('hint').textContent = coarse
  ? 'Drag to look around. Use the arrows to walk.'
  : 'Drag to look around. Walk with W A S D or the arrow keys; hold Shift to go faster.';

/* ---------- renderer ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 1400);
camera.rotation.order = 'YXZ';

/* ---------- helpers ---------- */
function tex(w, h, draw, rx, ry){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx || 1, ry || 1);
  t._draw = draw; t._canvas = c;
  return t;
}
function speckle(g, w, h, n, a){
  for (let i = 0; i < n; i++){
    g.fillStyle = Math.random() < .5 ? `rgba(0,0,0,${Math.random()*a})` : `rgba(255,255,255,${Math.random()*a})`;
    g.fillRect(Math.random()*w, Math.random()*h, 2, 2);
  }
}
function std(color, o){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:.85, metalness:0}, o || {})); }
function add(geo, mat, x, y, z, parent, cast){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = cast !== false; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}

/* ---------- textures ---------- */
const marbleTex = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#f2eee6'; g.fillRect(0, 0, w, h);
  g.lineWidth = 1.2;
  for (let i = 0; i < 26; i++){
    g.strokeStyle = `rgba(120,110,100,${.08 + Math.random()*.12})`;
    g.beginPath(); let x = Math.random()*w, y = Math.random()*h; g.moveTo(x, y);
    for (let k = 0; k < 4; k++){ g.bezierCurveTo(x+Math.random()*120-60, y+Math.random()*120-60, x+Math.random()*160-80, y+Math.random()*160-80, x+=Math.random()*180-90, y+=Math.random()*180-90); }
    g.stroke();
  }
  speckle(g, w, h, 5000, .06);
}, 6, 1);

const floorTex = tex(512, 512, (g) => {
  g.fillStyle = '#b39046'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++){
    const x = i*256, y = j*256, alt = (i + j) % 2;
    g.fillStyle = alt ? '#d4ccbd' : '#c8aa62'; g.fillRect(x+10, y+10, 236, 236);
    if (!alt){
      g.fillStyle = '#e9e2d4'; g.beginPath(); g.arc(x+128, y+128, 104, 0, Math.PI*2); g.fill();
      g.fillStyle = '#7B2D26'; g.beginPath(); g.arc(x+128, y+128, 94, 0, Math.PI*2); g.fill();
    } else {
      g.fillStyle = '#8a3a30'; g.fillRect(x+40, y+40, 176, 176);
      g.fillStyle = '#5d6166'; g.fillRect(x+50, y+50, 156, 156);
    }
  }
  speckle(g, 512, 512, 9000, .12);
}, 7.2, 7.2);

const atticTex = tex(1024, 256, (g) => {
  g.fillStyle = '#e3dccf'; g.fillRect(0, 0, 1024, 256);
  for (let p = 0; p < 2; p++){
    const o = p*512;
    g.fillStyle = '#efe9de'; g.fillRect(o+20, 20, 60, 236);
    g.strokeStyle = 'rgba(90,80,70,.35)'; g.lineWidth = 3; g.strokeRect(o+20, 20, 60, 236);
    g.fillStyle = '#b9ad9a'; g.fillRect(o+190, 60, 200, 150);
    g.fillStyle = '#8a3a30'; g.fillRect(o+212, 82, 156, 106);
    g.strokeStyle = 'rgba(90,80,70,.45)'; g.strokeRect(o+190, 60, 200, 150);
  }
  g.fillStyle = 'rgba(90,80,70,.3)'; g.fillRect(0, 0, 1024, 12);
  speckle(g, 1024, 256, 3000, .07);
}, 14, 1);

const brickTex = tex(256, 256, (g) => {
  g.fillStyle = '#b9a58a'; g.fillRect(0, 0, 256, 256);
  for (let r = 0; r < 16; r++) for (let c = 0; c < 5; c++){
    const off = (r % 2) * 26;
    g.fillStyle = ['#a7714f','#9c6648','#b07a56','#a26c4c'][(r*3+c)%4];
    g.fillRect(c*52 - off + 2, r*16 + 2, 48, 12);
  }
  speckle(g, 256, 256, 3000, .1);
}, 10, 6);

const cobbleTex = tex(256, 256, (g) => {
  g.fillStyle = '#5e5850'; g.fillRect(0, 0, 256, 256);
  for (let r = 0; r < 16; r++) for (let c = 0; c < 16; c++){
    const s = 60 + Math.random()*40;
    g.fillStyle = `rgb(${s+20},${s+14},${s+4})`;
    g.beginPath();
    if (g.roundRect) g.roundRect(c*16+1.5, r*16+1.5, 13, 13, 4); else g.rect(c*16+1.5, r*16+1.5, 13, 13);
    g.fill();
  }
  speckle(g, 256, 256, 2500, .12);
}, 80, 80);

const facadeBase = (g) => {
  g.fillStyle = '#d29a62'; g.fillRect(0, 0, 256, 256);
  speckle(g, 256, 256, 2500, .08);
  for (let c = 0; c < 2; c++){
    g.fillStyle = '#efe2c9'; g.fillRect(c*128+34, 52, 60, 120);
    g.fillStyle = '#3f5a48'; g.fillRect(c*128+40, 58, 22, 108); g.fillRect(c*128+66, 58, 22, 108);
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(c*128+63, 58, 3, 108);
  }
};
const facadeTex = tex(256, 256, facadeBase);

const stoneTex = tex(256, 256, (g) => {
  g.fillStyle = '#c9c0b0'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = 'rgba(80,70,60,.25)'; g.lineWidth = 2;
  for (let i = 0; i <= 4; i++){ g.beginPath(); g.moveTo(i*64, 0); g.lineTo(i*64, 256); g.stroke(); g.beginPath(); g.moveTo(0, i*64); g.lineTo(256, i*64); g.stroke(); }
  speckle(g, 256, 256, 4000, .1);
}, 1, 1);

/* ---------- materials ---------- */
const M = {
  wall: std('#ddd4c4', {map: marbleTex}),
  niche: std('#cbc1ae', {map: marbleTex, side: THREE.DoubleSide}),
  attic: std('#ffffff', {map: atticTex, side: THREE.DoubleSide}),
  dome: std('#d3cab9', {side: THREE.DoubleSide, roughness: .95}),
  rib: std('#e3dbcc', {roughness: .9}),
  cornice: std('#ece5d8'),
  giallo: std('#c9a862', {roughness: .45}),
  pavo: std('#e4dccd', {roughness: .5, map: marbleTex}),
  porphyry: std('#7B2D26', {roughness: .4}),
  granite: std('#7d7874', {roughness: .55}),
  rose: std('#9b7a70', {roughness: .55}),
  capital: std('#e8e1d3', {roughness: .7}),
  bronze: std('#6d5634', {roughness: .4, metalness: .65}),
  brick: std('#ffffff', {map: brickTex, side: THREE.DoubleSide}),
  lead: std('#8f969a', {roughness: .7, side: THREE.DoubleSide}),
  stucco: std('#cfc7b8'),
  travertine: std('#d9cfbc', {map: stoneTex}),
  roof: std('#a65a3c'),
  water: std('#6f97a8', {roughness: .15, metalness: .2}),
};
M.wall.map.repeat.set(6, 1);
M.wall.side = THREE.DoubleSide;

/* ---------- sky + light ---------- */
const skyTex = tex(8, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#4f7fb0'); gr.addColorStop(.47, '#b5cbdc'); gr.addColorStop(.52, '#d9d2c2'); gr.addColorStop(1, '#a89a84');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
skyTex.wrapS = skyTex.wrapT = THREE.ClampToEdgeWrapping;
scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.MeshBasicMaterial({map: skyTex, side: THREE.BackSide, fog: false})));
scene.fog = new THREE.Fog(0xd2d2c8, 160, 700);

const hemi = new THREE.HemisphereLight(0xe2eaf2, 0x8a7a64, 0.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 1.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -48; sc.right = 48; sc.top = 48; sc.bottom = -48; sc.near = 1; sc.far = 300;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
sun.target.position.set(0, 12, 8);
scene.add(sun, sun.target);

/* ---------- ground ---------- */
const piazza = add(new THREE.PlaneGeometry(400, 400), std('#ffffff', {map: cobbleTex}), 0, 0, 0, scene, false);
piazza.rotation.x = -Math.PI/2;

/* ---------- rotunda interior ---------- */
const floor = add(new THREE.CircleGeometry(R + .05, 96), std('#ffffff', {map: floorTex, roughness: .45}), 0, .03, 0, scene, false);
floor.rotation.x = -Math.PI/2;

const LOWER = 10.5, DOOR_H = 7.6, DOOR_HALF = 3.2;
const gaps = [];
for (let k = 0; k < 8; k++){
  const half = k === 0 ? DOOR_HALF : (k === 4 ? 4.6 : 3.9);
  gaps.push({phi: k*Math.PI/4, g: 2*Math.asin(half/R), half});
}
// lower wall piers between the eight openings
for (let k = 0; k < 8; k++){
  const a = gaps[k], b = gaps[(k+1)%8];
  const start = a.phi + a.g/2;
  const end = b.phi + (k === 7 ? Math.PI*2 : 0) - b.g/2;
  add(new THREE.CylinderGeometry(R, R, LOWER, 24, 1, true, start, end - start), M.wall, 0, LOWER/2, 0);
}
// wall above the door
add(new THREE.CylinderGeometry(R, R, LOWER - DOOR_H, 8, 1, true, -gaps[0].g/2, gaps[0].g), M.wall, 0, DOOR_H + (LOWER - DOOR_H)/2, 0);
// entablature zone and attic
add(new THREE.CylinderGeometry(R, R, 3.5, 128, 1, true), M.wall, 0, LOWER + 1.75, 0);
add(new THREE.CylinderGeometry(R, R, H - 14, 128, 1, true), M.attic, 0, 14 + (H - 14)/2, 0);
[[LOWER, .4, .36], [14, .3, .28], [H, .45, .5]].forEach(([y, inset, tube]) => {

  if (insideRotunda(from.z) !== insideRotunda(to.z)) pts.push(new V3(0, EYE, 21), new V3(0, EYE, 31));
  pts.push(to);
  const lens = [0]; for (let k = 1; k < pts.length; k++) lens.push(lens[k-1] + pts[k].distanceTo(pts[k-1]));
  let dyaw = ((s.yaw - yaw + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
  fly = {t: 0, dur: Math.min(4.2, 1.4 + lens[lens.length - 1]/30), pts, lens, y0: yaw, dy: dyaw, p0: pitch, p1: s.pitch};
}
function allowed(x, z){
  if (Math.hypot(x, z) < 19.8) return true;
  if (Math.abs(x) < 2.5 && z > 15 && z < 31) return true;
  if (z > 30.2 && z < 102 && Math.abs(x) < 40){
    for (const c of colliders) if (Math.hypot(x - c.x, z - c.z) < c.r) return false;
    return true;
  }
  return false;
}
const keys = {};
const keyMap = {KeyW: 'f', ArrowUp: 'f', KeyS: 'b', ArrowDown: 'b', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r'};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (keyMap[e.code]){ keys[keyMap[e.code]] = true; e.preventDefault(); }
  if (e.key === 'Shift') keys.run = true;
});
addEventListener('keyup', e => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; if (e.key === 'Shift') keys.run = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const d = b.dataset.dir;
  const on = e => { e.preventDefault(); keys[d] = true; b.setPointerCapture && b.setPointerCapture(e.pointerId); };
  const off = () => { keys[d] = false; };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------- pointer look + picking ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = $('tip');
let drag = null, lastHover = 0;
function pick(cx, cy){
  ndc.set(cx/innerWidth*2 - 1, -(cy/innerHeight)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(hotspots);
  if (!hits.length) return null;
  const blockers = ray.intersectObjects(scene.children, true).filter(h => !(h.object instanceof THREE.Sprite) && h.object !== beam);
  if (blockers.length && blockers[0].distance < hits[0].distance - .5) return null;
  return hits[0].object.userData.stop;
}
canvas.addEventListener('pointerdown', e => {
  drag = {x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY};
  canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging'); tip.hidden = true;
});
canvas.addEventListener('pointermove', e => {
  if (drag){
    const k = e.pointerType === 'touch' ? .0055 : .0042;
    yaw -= (e.clientX - drag.x)*k; pitch -= (e.clientY - drag.y)*k;
    pitch = Math.max(-1.45, Math.min(1.52, pitch));
    drag.x = e.clientX; drag.y = e.clientY;
    if (fly && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) fly = null;
    return;
  }
  const now = performance.now(); if (now - lastHover < 70) return; lastHover = now;
  const s = pick(e.clientX, e.clientY);
  canvas.classList.toggle('pointing', s !== null);
  if (s !== null){ tip.textContent = `${s + 1}. ${stops[s].title}`; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.hidden = false; }
  else tip.hidden = true;
});
canvas.addEventListener('pointerup', e => {
  if (drag && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6){
    const s = pick(e.clientX, e.clientY); if (s !== null) goTo(s);
  }
  drag = null; canvas.classList.remove('dragging');
});
canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('dragging'); });
canvas.addEventListener('pointerleave', () => { tip.hidden = true; });

/* ---------- sun ---------- */
const sunIn = $('sun'), sunOut = $('sunOut');
const sunDir = new V3(), up = new V3(0, 1, 0);
const cLow = new THREE.Color('#ffb784'), cHigh = new THREE.Color('#fff4e2');
function fmt(h){ const hh = Math.floor(h), mm = Math.round((h - hh)*60); const ap = hh >= 12 ? 'PM' : 'AM'; return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${ap}`; }
function setSun(h){
  const a = Math.PI*(h - 6)/12, s = Math.sin(a);
  const elev = THREE.MathUtils.degToRad(6 + 64*s);
  sunDir.set(-Math.cos(a)*Math.cos(elev), Math.sin(elev), -Math.sin(a)*Math.cos(elev)).normalize();
  sun.position.copy(sun.target.position).addScaledVector(sunDir, 140);
  sun.color.copy(cLow).lerp(cHigh, Math.min(1, s*1.4));
  sun.intensity = 1.1 + .7*s;
  hemi.intensity = .38 + .16*s;
  const d = sunDir.clone().negate(), horiz = Math.hypot(d.x, d.z);
  const tFloor = OC_Y/(-d.y), tWall = horiz > 1e-4 ? (R - .2)/horiz : Infinity;
  const L = Math.min(tFloor, tWall);
  beam.scale.set(1, L, 1);
  beam.position.set(0, OC_Y, 0).addScaledVector(d, L/2);
  beam.quaternion.setFromUnitVectors(up, d);
  sunOut.textContent = fmt(h);
}
sunIn.addEventListener('input', () => setSun(parseFloat(sunIn.value)));
setSun(parseFloat(sunIn.value));

/* ---------- loop ---------- */
function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight;
  camera.fov = camera.aspect < .8 ? 80 : 70;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
const fwd = new V3(), right = new V3();
function ease(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }
function tick(){
  const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;
  if (fly){
    fly.t += dt/fly.dur;
    const t = Math.min(1, fly.t), e = ease(t), total = fly.lens[fly.lens.length - 1], dist = e*total;
    let k = 1; while (k < fly.lens.length - 1 && fly.lens[k] < dist) k++;
    const seg = fly.lens[k] - fly.lens[k-1] || 1;
    camera.position.lerpVectors(fly.pts[k-1], fly.pts[k], (dist - fly.lens[k-1])/seg);
    yaw = fly.y0 + fly.dy*e; pitch = fly.p0 + (fly.p1 - fly.p0)*e;
    if (t >= 1) fly = null;
  } else if (keys.f || keys.b || keys.l || keys.r){
    const sp = (keys.run ? 11 : 5.5)*dt;
    fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw)); right.set(Math.cos(yaw), 0, -Math.sin(yaw));
    let mx = 0, mz = 0;
    if (keys.f){ mx += fwd.x; mz += fwd.z; } if (keys.b){ mx -= fwd.x; mz -= fwd.z; }
    if (keys.r){ mx += right.x; mz += right.z; } if (keys.l){ mx -= right.x; mz -= right.z; }
    const n = Math.hypot(mx, mz) || 1; mx = mx/n*sp; mz = mz/n*sp;
    const p = camera.position;
    if (allowed(p.x + mx, p.z + mz)){ p.x += mx; p.z += mz; }
    else if (allowed(p.x + mx, p.z)) p.x += mx;
    else if (allowed(p.x, p.z + mz)) p.z += mz;
  }
  camera.rotation.set(pitch, yaw, 0);
  hotspots.forEach((h, i) => {
    const d = h.position.distanceTo(camera.position);
    const pulse = reduceMotion ? 1 : 1 + .12*Math.sin(time*2.4 + i);
    const s = Math.max(.7, Math.min(4, d*.05))*pulse*(i === current ? .75 : 1);
    h.scale.set(s, s, 1);
    h.material.opacity = i === current ? .55 : 1;
  });
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
renderInfo();
tick();
})();
</script>
